<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>hpv-mixed-gallery — demo</title>
		<!-- Bulma CSS 1.0.3 -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bulma@1.0.3/css/bulma.min.css"
		/>
		<!-- FontAwesome 6 -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<!-- hpv-image-previewer (demo-only, for the onItemClick lightbox) -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/hpv-image-previewer@1.0.2/dist/css/all.css"
		/>
		<!-- Uppy (demo-only, for the Uppy upload plugin) -->
		<link
			rel="stylesheet"
			href="https://releases.transloadit.com/uppy/v3.27.3/uppy.min.css"
		/>
		<!-- Component styles -->
		<link rel="stylesheet" href="src/css/hpv-mixed-gallery.css" />
		<style>
			body {
				background-color: #f8fafc;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
			}

			/* Demo-only PDF preview overlay (rendered with pdf.js) */
			.pdf-overlay {
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				background: rgba(15, 23, 42, 0.6);
			}
			.pdf-overlay[hidden] {
				display: none;
			}
			.pdf-modal {
				display: flex;
				flex-direction: column;
				width: 100%;
				max-width: 760px;
				max-height: 90vh;
				overflow: hidden;
				background: #fff;
				border-radius: 10px;
			}
			.pdf-toolbar {
				display: flex;
				flex-wrap: wrap; /* controls wrap instead of clipping on mobile */
				align-items: center;
				justify-content: space-between;
				gap: 0.5rem 0.75rem;
				padding: 0.75rem 1rem;
				border-bottom: 1px solid #e2e8f0;
			}
			.pdf-title {
				flex: 0 1 auto;
				min-width: 0;
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
				font-size: 14px;
				font-weight: 600;
				color: #0f172a;
			}
			.pdf-tools {
				display: flex;
				align-items: center;
				gap: 1rem;
				font-size: 13px;
				color: #475569;
			}
			.pdf-counter {
				min-width: 56px;
				text-align: center;
			}
			.pdf-zoom {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
			}
			.pdf-zoom button {
				width: 26px;
				height: 26px;
				border: 1px solid #cbd5e1;
				border-radius: 6px;
				background: #fff;
				color: #0f172a;
				font-size: 15px;
				line-height: 1;
				cursor: pointer;
			}
			.pdf-zoom button:hover {
				background: #f1f5f9;
			}
			.pdf-zoom button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			.pdf-zoom-label {
				min-width: 44px;
				text-align: center;
			}
			.pdf-download {
				width: 26px;
				height: 26px;
				border: 1px solid #cbd5e1;
				border-radius: 6px;
				background: #fff;
				color: #0f172a;
				cursor: pointer;
			}
			.pdf-download:hover {
				background: #f1f5f9;
			}
			.pdf-close {
				flex: none;
				padding: 0.4rem 0.9rem;
				border: none;
				border-radius: 6px;
				background: #0f172a;
				color: #fff;
				font-weight: 500;
				cursor: pointer;
			}
			.pdf-pages {
				overflow: auto;
				padding: 1rem;
				background: #f1f5f9;
			}
			.pdf-page {
				display: block;
				margin: 0 auto 0.75rem;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
			}
			.pdf-page:last-child {
				margin-bottom: 0;
			}
			.pdf-loading,
			.pdf-error {
				padding: 2rem;
				font-size: 13px;
				color: #475569;
			}
		</style>
	</head>
	<body>
		<div id="media-library"></div>

		<!-- Demo-only PDF preview overlay (filled by pdf.js) -->
		<div class="pdf-overlay" id="pdf-overlay" hidden>
			<div class="pdf-modal">
				<div class="pdf-toolbar">
					<span class="pdf-title"></span>
					<div class="pdf-tools">
						<span class="pdf-counter">– / –</span>
						<span class="pdf-zoom">
							<button
								class="pdf-zoom-out"
								type="button"
								aria-label="Diminuir zoom"
							>
								−
							</button>
							<span class="pdf-zoom-label">100%</span>
							<button
								class="pdf-zoom-in"
								type="button"
								aria-label="Aumentar zoom"
							>
								+
							</button>
						</span>
						<button
							class="pdf-download"
							type="button"
							title="Baixar"
							aria-label="Baixar PDF"
						>
							<i class="fa-solid fa-download"></i>
						</button>
					</div>
					<button class="pdf-close" type="button">Fechar</button>
				</div>
				<div class="pdf-pages"></div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/hpv-image-previewer@1.0.2/dist/js/all.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
		<script src="src/js/hpv-mixed-gallery.js"></script>
		<!-- upload-method plugins (registered after construction) -->
		<script src="https://releases.transloadit.com/uppy/v3.27.3/uppy.min.js"></script>
		<script src="src/js/plugins/local-upload.js"></script>
		<script src="src/js/plugins/camera-capture.js"></script>
		<script src="src/js/plugins/xhr-upload.js"></script>
		<script src="src/js/plugins/uppy-upload.js"></script>
		<script src="src/js/plugins/s3-upload.js"></script>
		<script src="src/js/plugins/url-import.js"></script>
		<script>
			// Demo-only: the gallery fires onItemClick for ANY card; the host
			// decides what to do based on the asset's type/extension. Images open
			// an HpvImagePreviewer lightbox; PDFs render in a pdf.js overlay.
			const previewer = new HpvImagePreviewer({
				closeButtonText: 'Fechar',
			});

			// --- pdf.js preview (demo-only) ---
			pdfjsLib.GlobalWorkerOptions.workerSrc =
				'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
			const pdfOverlay = document.getElementById('pdf-overlay');
			const pdfPages = pdfOverlay.querySelector('.pdf-pages');
			const pdfTitle = pdfOverlay.querySelector('.pdf-title');
			const pdfCounter = pdfOverlay.querySelector('.pdf-counter');
			const pdfZoomLabel = pdfOverlay.querySelector('.pdf-zoom-label');

			let pdfDoc = null; // current PDFDocumentProxy
			let pdfScale = 1.3; // current render scale
			let pageCanvases = []; // one <canvas> per page, in order
			let renderToken = 0; // guards against overlapping re-renders
			let pdfSource = null; // { url, name } of the open PDF (for download)

			const closePdf = () => {
				pdfOverlay.hidden = true;
				pdfDoc = null;
				pdfSource = null;
				pageCanvases = [];
				pdfPages.innerHTML = ''; // free rendered canvases
			};
			pdfOverlay
				.querySelector('.pdf-close')
				.addEventListener('click', closePdf);
			pdfOverlay
				.querySelector('.pdf-download')
				.addEventListener('click', () => {
					if (pdfSource) downloadAsset(pdfSource);
				});
			pdfOverlay.addEventListener('click', (e) => {
				if (e.target === pdfOverlay) closePdf(); // backdrop click
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && !pdfOverlay.hidden) closePdf();
			});

			// which page is currently in view (probe ~30% down the viewport)
			function currentPage() {
				if (!pageCanvases.length) return 1;
				const probe =
					pdfPages.getBoundingClientRect().top +
					pdfPages.clientHeight * 0.3;
				let page = 1;
				pageCanvases.forEach((c, i) => {
					if (c.getBoundingClientRect().top <= probe) page = i + 1;
				});
				return page;
			}
			function updateCounter() {
				const total = pdfDoc ? pdfDoc.numPages : '–';
				pdfCounter.textContent = `${currentPage()} / ${total}`;
			}
			pdfPages.addEventListener('scroll', updateCounter);

			async function renderPages(keepPage = 1) {
				if (!pdfDoc) return;
				const token = ++renderToken; // newest render wins
				pdfPages.innerHTML = '';
				pageCanvases = [];
				updateZoom(); // label + disable zoom buttons at the 50%/300% limits
				updateCounter(); // show "1 / N" immediately, before pages finish
				for (let n = 1; n <= pdfDoc.numPages; n++) {
					const page = await pdfDoc.getPage(n);
					if (token !== renderToken) return; // superseded by newer render
					const viewport = page.getViewport({ scale: pdfScale });
					const canvas = document.createElement('canvas');
					canvas.className = 'pdf-page';
					canvas.width = viewport.width;
					canvas.height = viewport.height;
					pdfPages.appendChild(canvas);
					pageCanvases.push(canvas);
					await page.render({
						canvasContext: canvas.getContext('2d'),
						viewport,
					}).promise;
					if (token !== renderToken) return;
				}
				// keep the same page in view after a zoom re-render
				if (keepPage > 1 && pageCanvases[keepPage - 1]) {
					pdfPages.scrollTop +=
						pageCanvases[keepPage - 1].getBoundingClientRect().top -
						pdfPages.getBoundingClientRect().top;
				}
				updateCounter();
			}

			const zoomInBtn = pdfOverlay.querySelector('.pdf-zoom-in');
			const zoomOutBtn = pdfOverlay.querySelector('.pdf-zoom-out');
			function updateZoom() {
				pdfZoomLabel.textContent = Math.round(pdfScale * 100) + '%';
				zoomOutBtn.disabled = pdfScale <= 0.5; // at min
				zoomInBtn.disabled = pdfScale >= 3; // at max
			}
			function zoom(delta) {
				if (!pdfDoc) return;
				const next = Math.min(
					3,
					Math.max(0.5, +(pdfScale + delta).toFixed(2)),
				);
				if (next === pdfScale) return;
				const keep = currentPage();
				pdfScale = next;
				renderPages(keep);
			}
			zoomInBtn.addEventListener('click', () => zoom(0.2));
			zoomOutBtn.addEventListener('click', () => zoom(-0.2));

			async function openPdf(url, name) {
				pdfTitle.textContent = name;
				pdfSource = { url, name };
				pdfCounter.textContent = '– / –';
				pdfPages.innerHTML = '<p class="pdf-loading">Carregando…</p>';
				pdfOverlay.hidden = false;
				try {
					pdfDoc = await pdfjsLib.getDocument(url).promise;
					// initial scale: fit the page width to the viewer
					const first = await pdfDoc.getPage(1);
					const base = first.getViewport({ scale: 1 });
					const fitWidth = pdfPages.clientWidth - 32; // minus padding
					pdfScale =
						fitWidth > 0
							? Math.min(2, Math.max(0.5, fitWidth / base.width))
							: 1.3;
					await renderPages();
				} catch (err) {
					pdfPages.innerHTML =
						'<p class="pdf-error">Não foi possível carregar o PDF.</p>';
					console.error(err);
				}
			}

			// demo-only: a real downloadable blob for the spreadsheet card
			const sampleCsvUrl = URL.createObjectURL(
				new Blob(['Item,Qtd\nSwitch,2\nPatch panel,1\nServidor,4\n'], {
					type: 'text/csv',
				}),
			);

			// files without a preview (csv/xlsx/other) download on click
			async function downloadAsset(asset) {
				if (!asset.url) {
					console.log('sem fonte para download:', asset.name);
					return;
				}
				try {
					const res = await fetch(asset.url);
					const blob = await res.blob();
					const obj = URL.createObjectURL(blob);
					const a = document.createElement('a');
					a.href = obj;
					a.download = asset.name;
					document.body.appendChild(a);
					a.click();
					a.remove();
					URL.revokeObjectURL(obj);
				} catch (err) {
					window.open(asset.url, '_blank'); // fallback (e.g. CORS)
					console.error(err);
				}
			}

			const gallery = new HpvMixedGallery('media-library', {
				maxItems: 12,
				items: [
					// image assets carry a `url` so the previewer has something to show.
					// Varied dimensions to exercise the cover-fit thumbnail + previewer.
					{
						name: 'rack_frontal.jpg', // landscape 4:3
						size: '1.2 MB',
						ext: 'JPG',
						url: 'https://picsum.photos/seed/rack1/1024/768',
					},
					{
						name: 'rack_traseiro.jpg', // wide 16:9
						size: '1.4 MB',
						ext: 'JPG',
						url: 'https://picsum.photos/seed/rack2/1280/720',
					},
					{
						name: 'rack_lateral.jpg', // portrait 2:3
						size: '980 KB',
						ext: 'JPG',
						url: 'https://picsum.photos/seed/rack3/600/900',
					},
					{
						name: 'etiqueta_serial.jpg', // square 1:1
						size: '420 KB',
						ext: 'PNG',
						url: 'https://picsum.photos/seed/rack4/800/800',
					},
					{
						name: 'painel_frontal.jpg', // panorama 8:3
						size: '1.6 MB',
						ext: 'JPG',
						url: 'https://picsum.photos/seed/rack5/1600/600',
					},
					{
						name: 'topo_rack.jpg', // tall 1:2
						size: '760 KB',
						ext: 'WEBP',
						url: 'https://picsum.photos/seed/rack6/500/1000',
					},
					{
						name: 'cabo_traseiro.jpg', // small 4:3
						size: '180 KB',
						ext: 'JPG',
						url: 'https://picsum.photos/seed/rack7/480/360',
					},
					{
						name: 'relatorio_config.pdf',
						size: '2.4 MB',
						ext: 'PDF',
						url: 'https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf',
					},
					{
						name: 'inventario_rack.csv', // no preview -> downloads on click
						size: '512 KB',
						ext: 'CSV',
						url: sampleCsvUrl,
					},
				],
				onAdd: (c, asset) => console.log('add', asset),
				onRemove: (c, id) => console.log('remove', id),
				onItemClick: (c, asset) => {
					// type/extension decides what a click does
					const ext = (asset.ext || '').toUpperCase();
					if (['JPG', 'JPEG', 'PNG', 'GIF', 'WEBP'].includes(ext)) {
						// images -> HpvImagePreviewer gallery
						const imgs = c.getImages().filter((a) => a.url);
						const list = imgs.map((a) => ({
							url: a.url,
							alt: a.name,
						}));
						const index = imgs.findIndex((a) => a.id === asset.id);
						if (index >= 0) previewer.showGallery(list, index);
						else console.log('no preview url for', asset.name);
						return;
					}
					if (ext === 'PDF' && asset.url) {
						openPdf(asset.url, asset.name); // pdf.js overlay
						return;
					}
					downloadAsset(asset); // no preview -> download
				},
				onSave: (c, assets) =>
					alert(`Galeria salva com ${assets.length} item(ns)!`),
			});

			// Upload methods are plugins — register them (first = active tab).
			gallery.registerUploadPlugin(new HpvLocalUpload());
			gallery.registerUploadPlugin(new HpvCameraCapture()); // real WebRTC
			gallery.registerUploadPlugin(
				// demo endpoint just echoes the request (no hosted file) — so don't
				// link cards to a URL. A real upload API returns the stored file URL.
				new HpvXhrUpload({
					label: 'Servidor',
					endpoint: 'https://httpbin.org/post',
					responseParser: () => ({}),
				}),
			);
			gallery.registerUploadPlugin(
				// local mode adds chosen files straight to the gallery (no server)
				new HpvUppyUpload({ mode: 'local' }),
			);

			gallery.registerUploadPlugin(
				new HpvS3Upload({
					label: 'Amazon S3',
					// DEMO ONLY: no real backend/bucket here, so we simulate the
					// signer — PUT to an echo endpoint (stands in for a presigned
					// URL) and preview the local copy. In production, `sign` calls
					// YOUR backend and returns the real { url, publicUrl } — e.g.:
					//   sign: async (file) => (await fetch('/api/s3-sign', {
					//     method: 'POST', headers: { 'Content-Type': 'application/json' },
					//     body: JSON.stringify({ name: file.name, type: file.type, size: file.size }),
					//   })).json()
					sign: (file) =>
						Promise.resolve({
							method: 'PUT',
							url: 'https://httpbin.org/put',
							publicUrl: URL.createObjectURL(file),
						}),
				}),
			);
			// paste a remote URL → card references it (no server needed)
			gallery.registerUploadPlugin(new HpvUrlImport());
		</script>
	</body>
</html>
